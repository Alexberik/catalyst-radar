name: Demo market data collector

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/collect_demo_data.py"
      - ".github/workflows/demo-market-data.yml"
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: demo-market-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect public demo data
        run: python scripts/collect_demo_data.py
      - name: Commit rolling 24-hour snapshot history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/demo-market.json
          if git diff --cached --quiet; then
            echo "No data changes to commit"
          else
            git commit -m "chore(data): refresh demo market snapshot"
            git pull --rebase origin main
            git push
          fi
