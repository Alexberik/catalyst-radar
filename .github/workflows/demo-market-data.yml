name: Demo market data collector

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/collect_demo_data.py"
      - ".github/workflows/demo-market-data.yml"
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: demo-market-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore rolling history from market-data branch
        run: |
          git fetch origin market-data
          git show origin/market-data:data/demo-market.json > data/demo-market.json
      - name: Collect public demo data
        run: python scripts/collect_demo_data.py
      - name: Store rolling history on the market-data branch
        run: |
          cp data/demo-market.json "$RUNNER_TEMP/demo-market.json"
          git fetch origin market-data
          git checkout -B market-data origin/market-data
          mkdir -p data
          cp "$RUNNER_TEMP/demo-market.json" data/demo-market.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/demo-market.json
          if git diff --cached --quiet; then
            echo "No data changes to commit"
          else
            git commit -m "chore(data): refresh demo market snapshot"
            git pull --rebase origin market-data
            git push origin HEAD:market-data
          fi
